<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="640" viewBox="0 0 1024 640" role="img" aria-labelledby="title desc">
<title id="title">Measured p95 latency at concurrency 30</title>
<desc id="desc">Median of three run-level p95 latencies, 240 measured requests and 30 warmup requests per run. Each of the four scenario panels uses its own linear millisecond scale. Values are derived from local-runs.csv.</desc>
<rect width="1024" height="640" fill="#f4f7fa"/>
<g font-family="system-ui, sans-serif" fill="#17263a">
<text x="24" y="37" font-size="24" font-weight="700">Measured p95 latency at concurrency 30</text>
<text x="24" y="66" font-size="15">Median of 3 runs · 240 requests/run · 30 warmup requests · lower is better</text>
<rect x="24" y="82" width="13" height="13" fill="#b13d31"/><text x="44" y="94" font-size="14">Violation</text>
<rect x="150" y="82" width="13" height="13" fill="#167668"/><text x="170" y="94" font-size="14">Solution</text>
<rect x="24" y="116" width="476" height="208" rx="10" fill="white" stroke="#d6dfe8"/>
